syntax = "proto3";

package lewkit.term;

option go_package = "github.com/lewtec/lewkit/x/term/schema";

// Envelope is one record on the term socket.
// The socket writes each Envelope with a varint length prefix.
// version is 1. A request sets id and method. A response uses that same id.
// A push sets notice and leaves id at 0.
message Envelope {
  uint32 version = 1;
  uint32 id = 2;
  string method = 3;
  string notice = 4;
  oneof payload {
    SessionInfo session = 10;
    PaneList pane_list = 11;
    Pane pane = 12;
    Ack ack = 13;
    Failure error = 14;
    PaneId pane_id = 15;
    CreateRequest create = 16;
    WriteRequest write = 17;
    WatchRequest watch = 18;
  }
}

// SessionInfo is the ubersession membership.
// panes is creation order. It is not a layout.
message SessionInfo {
  string id = 1;
  repeated string panes = 2;
}

// PaneInfo is a pane record without the grid.
// exit is meaningful when alive is false. A signalled process may exit -1.
message PaneInfo {
  string id = 1;
  string title = 2;
  repeated string command = 3;
  string dir = 4;
  bool alive = 5;
  int32 exit = 6;
  int32 rows = 7;
  int32 cols = 8;
  uint64 revision = 9;
  string last_writer = 10;
  int32 cursor_row = 11;
  int32 cursor_col = 12;
}

// Cell is one column of the visible grid.
// rune is empty for a blank column. wide marks the second column of a
// double-width rune. fg and bg are palette indexes. 0 is the default color.
// 1 through 8 are the normal ANSI colors and 9 through 16 are the bright ones.
message Cell {
  string rune = 1;
  int32 fg = 2;
  int32 bg = 3;
  bool bold = 4;
  bool wide = 5;
}

// Pane is one pane record, including the visible grid in row-major order.
// cells has rows times cols entries. Scrollback stays on the server.
message Pane {
  string id = 1;
  string title = 2;
  repeated string command = 3;
  string dir = 4;
  bool alive = 5;
  int32 exit = 6;
  int32 rows = 7;
  int32 cols = 8;
  uint64 revision = 9;
  string last_writer = 10;
  int32 cursor_row = 11;
  int32 cursor_col = 12;
  repeated Cell cells = 13;
}

// PaneList is the pane headers in creation order.
message PaneList {
  repeated PaneInfo panes = 1;
}

// PaneId names one pane.
message PaneId {
  string id = 1;
}

// CreateRequest starts a process in a new pane.
// An empty command uses the SHELL environment variable, or /bin/sh.
// rows and cols are the initial grid. They are not a write, so last_writer
// stays empty until a client sends input.
message CreateRequest {
  repeated string command = 1;
  string dir = 2;
  int32 rows = 3;
  int32 cols = 4;
  string title = 5;
  string client = 6;
}

// WriteRequest sends terminal input to a pane.
// data is text, including control characters. rows and cols are the screen
// size of the client that is writing. Both zero keeps the current size.
// One of them set without the other is an error. A positive size that
// differs from the pane reflows the grid before the bytes are written.
message WriteRequest {
  string id = 1;
  string data = 2;
  int32 rows = 3;
  int32 cols = 4;
  string client = 5;
}

// WatchRequest replaces the panes this connection wants pushed.
// all watches the ubersession. Otherwise panes is the exact set, which may
// be empty. An empty set does not watch every pane.
message WatchRequest {
  bool all = 1;
  repeated string panes = 2;
}

// Ack is a successful call that returns no record.
message Ack {
  bool ok = 1;
}

// Failure is the error object on an RPC response.
// code is the sentinel text. text is the server sentence.
message Failure {
  string code = 1;
  string text = 2;
}
