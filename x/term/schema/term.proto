syntax = "proto3";

package lewkit.term;

option go_package = "github.com/lewtec/lewkit/x/term/schema";

// Envelope is one record on the term socket.
// The socket writes each Envelope with a varint length prefix.
// version is the frame version. It stays 1 while a frame still parses.
// A request sets id and method. A response uses that same id.
// A push sets notice and leaves id at 0.
// The protocol level travels on SessionInfo. A different level is a warning,
// not a broken frame.
message Envelope {
  uint32 version = 1;
  uint32 id = 2;
  string method = 3;
  string notice = 4;
  oneof payload {
    SessionInfo session = 10;
    PaneList pane_list = 11;
    Pane pane = 12;
    Ack ack = 13;
    Failure error = 14;
    PaneId pane_id = 15;
    CreateRequest create = 16;
    WriteRequest write = 17;
    WatchRequest watch = 18;
    Tree tree = 19;
    TreeRequest tree_request = 20;
    MoveRequest move = 21;
  }
}

// Entry is one key in the session tree.
// A directory is a folder. A file is one pane. name is the last segment.
// path is the full slash-separated key, with no leading slash.
message Entry {
  string name = 1;
  string path = 2;
  bool dir = 3;
  string pane = 4;
}

// SessionInfo is the ubersession membership.
// panes is creation order. It is not a layout.
// entries is the key tree. A folder is a stored directory or a pane prefix.
// level is the protocol level this server speaks. 0 is a server from before
// levels, which spoke level 1. Level 2 stores directories. Level 3 reports
// each pane's working directory and keeps session facts. Level 4 reads that
// directory from the process after its output stays quiet. The next read
// waits for more output.
// Level 5 keys pane facts by pane id so a move keeps them. A missing key
// inherits from the nearest ancestor directory. Directory facts move with
// the directory.
// dirs are the directories the server keeps, including empty ones.
// facts are key/value records. path is a pane id or a directory path.
message SessionInfo {
  string id = 1;
  repeated string panes = 2;
  repeated Entry entries = 3;
  uint32 level = 4;
  repeated string dirs = 5;
  repeated Fact facts = 6;
}

// Fact is one value in the pane and directory taxonomy.
// path is a pane id or a directory path. A pane's own value wins.
// A missing key inherits from the nearest ancestor directory.
// key and value are the record an application wrote from a pane.
message Fact {
  string path = 1;
  string key = 2;
  string value = 3;
}

// PaneInfo is a pane record without the grid.
// exit is meaningful when alive is false. A signalled process may exit -1.
message PaneInfo {
  string id = 1;
  string title = 2;
  repeated string command = 3;
  string dir = 4;
  bool alive = 5;
  int32 exit = 6;
  int32 rows = 7;
  int32 cols = 8;
  uint64 revision = 9;
  string last_writer = 10;
  int32 cursor_row = 11;
  int32 cursor_col = 12;
  // path is the pane's key. Empty is the same as id, at the root.
  string path = 13;
  // cwd is the directory the process last reported. Empty means dir, the
  // directory it was started in.
  string cwd = 14;
}

// Cell is one column of the visible grid.
// rune is empty for a blank column. wide marks the second column of a
// double-width rune. fg and bg are palette indexes when the matching mode
// is 0. 0 is the default color. 1 through 8 are the normal ANSI colors and
// 9 through 16 are the bright ones.
// mode 1 is a 256-color index. mode 2 is truecolor in rgb as 0xRRGGBB.
// Channel 0 is black, so mode is how a client tells black from unset.
message Cell {
  string rune = 1;
  int32 fg = 2;
  int32 bg = 3;
  bool bold = 4;
  bool wide = 5;
  uint32 fg_mode = 6;
  uint32 bg_mode = 7;
  uint32 fg_index = 8;
  uint32 bg_index = 9;
  uint32 fg_rgb = 10;
  uint32 bg_rgb = 11;
  bool reverse = 12;
}

// Pane is one pane record, including the visible grid in row-major order.
// cells has rows times cols entries. Scrollback stays on the server.
message Pane {
  string id = 1;
  string title = 2;
  repeated string command = 3;
  string dir = 4;
  bool alive = 5;
  int32 exit = 6;
  int32 rows = 7;
  int32 cols = 8;
  uint64 revision = 9;
  string last_writer = 10;
  int32 cursor_row = 11;
  int32 cursor_col = 12;
  repeated Cell cells = 13;
  string path = 14;
  // input is the private modes the process turned on, as bits.
  // 1 mouse (1000), 2 motion while a button is held (1002), 4 any motion (1003),
  // 8 SGR mouse (1006), 16 focus (1004), 32 bracketed paste (2004),
  // 64 wheel sends arrows (1007), 128 alternate screen.
  // A client encodes mouse and paste from these bits. Zero writes no mouse bytes.
  uint32 input = 15;
  // cwd is the directory the process last reported. Empty means dir.
  string cwd = 16;
}

// PaneList is the pane headers in creation order.
message PaneList {
  repeated PaneInfo panes = 1;
}

// PaneId names one pane.
message PaneId {
  string id = 1;
}

// CreateRequest starts a process in a new pane.
// An empty command uses the SHELL environment variable, or /bin/sh.
// rows and cols are the initial grid. They are not a write, so last_writer
// stays empty until a client sends input.
message CreateRequest {
  repeated string command = 1;
  string dir = 2;
  int32 rows = 3;
  int32 cols = 4;
  string title = 5;
  string client = 6;
  // path is the new pane's key. Empty stores the file at its id.
  // A trailing slash stores it inside that folder, named by the new id.
  // The key is not a host filesystem path.
  string path = 7;
}

// WriteRequest sends terminal input to a pane.
// data is text, including control characters. rows and cols are the screen
// size of the client that is writing. Both zero keeps the current size.
// One of them set without the other is an error. A positive size that
// differs from the pane reflows the grid before the bytes are written.
message WriteRequest {
  string id = 1;
  string data = 2;
  int32 rows = 3;
  int32 cols = 4;
  string client = 5;
}

// WatchRequest replaces the panes this connection wants pushed.
// all watches the ubersession. Otherwise panes is the exact set, which may
// be empty. An empty set does not watch every pane.
// prefix watches every pane whose key is that folder or a file inside it.
// A folder watch also receives session records. An exact pane set does not.
message WatchRequest {
  bool all = 1;
  repeated string panes = 2;
  string prefix = 3;
}

// TreeRequest names one folder.
// tree.list reads path. An empty path is the root.
// dir.create and dir.remove use path. dir.move reads path and dest.
message TreeRequest {
  string path = 1;
  string dest = 2;
}

// Tree is the direct children of one folder.
message Tree {
  string path = 1;
  repeated Entry entries = 2;
}

// MoveRequest gives a pane a new key.
message MoveRequest {
  string id = 1;
  string path = 2;
}

// Ack is a successful call that returns no record.
message Ack {
  bool ok = 1;
}

// Failure is the error object on an RPC response.
// code is the sentinel text. text is the server sentence.
message Failure {
  string code = 1;
  string text = 2;
}
