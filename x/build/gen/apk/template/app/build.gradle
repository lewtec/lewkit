plugins {
    id "com.android.application"
}

android {
    namespace = "{{.PackageID}}"
    compileSdk = 35

    defaultConfig {
        applicationId = "{{.PackageID}}"
        minSdk = 26
        targetSdk = 35
        versionCode = {{.VersionCode}}
        versionName = "{{.VersionName}}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Single-APK packaging; ABIs come from jniLibs/ (default: arm64-v8a).
    splits {
        abi {
            enable false
        }
    }
    // Extract jniLibs to the filesystem so ProcessBuilder can exec libeletrocromo.so
    // (filesDir is often noexec; nativeLibraryDir must be a real extracted path).
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            throw new GradleException("this host does not use Kotlin")
        }
    }
}

dependencies {
    // Java widget. The 1.1.0 graph is annotation, core 1.1.0, and interpolator.
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
}
