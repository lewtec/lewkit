name: Host

on:
  push:
  workflow_dispatch:

jobs:
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
      - name: JIT, FFI, and purego
        run: mise run test:host
        env:
          CGO_ENABLED: "0"
      - name: Tests
        run: mise run test
        env:
          CGO_ENABLED: "0"
