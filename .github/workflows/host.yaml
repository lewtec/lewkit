name: Host

on:
  push:
  workflow_dispatch:

jobs:
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
      - name: JIT, FFI, and purego
        run: mise run test:host
        env:
          CGO_ENABLED: "0"
      - name: Tests
        run: mise run test
        env:
          CGO_ENABLED: "0"
