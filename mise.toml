[tools]
"github:lewtec/modot" = "0.20.2"
go = "1.27.0"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
run = "go mod tidy && go get -v ./..."

[tasks.format]
run = "modot codebase format"

[tasks.lint]
run = "modot codebase lint"

[tasks.test]
run = "go test ./..."

[tasks.codegen]
run = "go generate ./..."

[tasks.ci]
depends = ["test", "lint"]

[tasks.release]
description = "Run a release"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
