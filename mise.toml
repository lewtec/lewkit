[tools]
"github:lewtec/modot" = "0.20.3"
go = "1.27.0"
goreleaser = "2.19.0"
svu = "3.3.0"

[tasks.install]
run = "go mod tidy && go get -v ./..."

[tasks.format]
run = "modot codebase format"

[tasks.lint]
run = "modot codebase lint"

[tasks.test]
description = "go test, skipping the vendored Go compiler tree"
run = "sh x/toolchain/test.sh"

[tasks."test:host"]
description = "JIT, FFI, and the cgo replacement on this host"
run = "go run ./x/toolchain/host"

[tasks.codegen]
description = "go:generate, skipping the vendored Go trees"
run = "sh x/toolchain/codegen.sh"

[tasks.ci]
description = "Test the module, then lint"
run = "sh x/toolchain/ci.sh"

[tasks.release]
description = "Run a release"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
