# Astro SSR (CF adapter) → orvalho pre-bundle → //go:embed → lewkit web window.
# JS toolchain: bun (same pin style as base16-showcase / ciborg).
# Build: mise install && mise run build
# Run from the repo root:
#   go run ./cmd/lewkit release run --config ./examples/astro/eletrocromo.json

[env]
_.path = ["./node_modules/.bin"]

[tools]
bun = "1.3.8"

[tasks.install]
description = "Install bun packages and download the parent Go module"
run = """
bun install
go mod download
"""

[tasks.astro]
description = "Astro SSR build (Cloudflare adapter) → dist/"
depends = ["install"]
run = "bun run build"

[tasks.assemble]
description = "Copy CF dist into worker/ for bundling"
run = """
# Astro 6 / @astrojs/cloudflare 13: dist/server + dist/client (pesquisarr layout)
# or dist/_worker.js (older CF pages-style layout).
rm -rf worker
mkdir -p worker/assets
if [ -d dist/server ]; then
  cp -a dist/server/. worker/
  if [ -d dist/client ]; then
    cp -a dist/client/. worker/assets/
  fi
elif [ -d dist/_worker.js ]; then
  cp -a dist/_worker.js/. worker/
  for f in dist/*; do
    base=$(basename "$f")
    case "$base" in
      _worker.js|_routes.json|wrangler.json|wrangler.toml) continue ;;
    esac
    [ -e "$f" ] && cp -a "$f" worker/assets/
  done
  if [ -f worker/index.js ] && [ ! -f worker/entry.mjs ]; then
    cp worker/index.js worker/entry.mjs
  fi
else
  echo "missing dist/server or dist/_worker.js — run: mise run astro" >&2
  ls -la dist >&2 || true
  exit 1
fi
if [ ! -f worker/entry.mjs ] && [ -f worker/index.js ]; then
  cp worker/index.js worker/entry.mjs
fi
if [ ! -f worker/entry.mjs ]; then
  echo "missing worker/entry.mjs after assemble" >&2
  ls -la worker >&2 || true
  exit 1
fi
echo "assembled CF dist → worker/"
"""

[tasks.embed]
description = "orvalho pre-bundle → embed/guest.js + embed/assets (//go:embed)"
depends = ["assemble"]
run = "go run ./genbundle.go"

[tasks.build]
description = "Astro SSR + assemble + embed into Go"
depends = ["astro"]
run = "mise run embed"

[tasks.run]
description = "Open the web window with a stamped release run"
run = "go -C ../.. run ./cmd/lewkit release run --config ./examples/astro/eletrocromo.json"

[tasks."run:build"]
description = "Build the embed, then open the window"
depends = ["build"]
run = "mise run run"
