# Astro site. entry is astro:.
# The release build runs `bun run build`. Install the packages first.
# From the repository root, with bun on PATH:
#   go run ./cmd/lewkit release run --config ./examples/app/astro/eletrocromo.json

[env]
_.path = ["./node_modules/.bin"]

[tools]
bun = "1.3.8"

[tasks.install]
description = "Install the bun packages in bun.lock"
run = "bun install"

[tasks.run]
description = "Open the window. Install the packages before the first run."
run = "go -C ../../.. run ./cmd/lewkit release run --config ./examples/app/astro/eletrocromo.json"
